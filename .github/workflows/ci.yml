name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    outputs:
      install_outcome: ${{ steps.install.outcome }}
      outcome: ${{ steps.prettier.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/prettier-install.log
      - name: Prettier
        id: prettier
        run: |
          set -o pipefail
          npm run format:check 2>&1 | tee /tmp/prettier.log
      - name: Upload Prettier log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-prettier
          path: /tmp/prettier.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload Prettier install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-prettier-install
          path: /tmp/prettier-install.log
          if-no-files-found: ignore
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    outputs:
      install_outcome: ${{ steps.install.outcome }}
      outcome: ${{ steps.lint.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/lint-install.log
      - name: Lint
        id: lint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/lint.log
      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-lint
          path: /tmp/lint.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload lint install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-lint-install
          path: /tmp/lint-install.log
          if-no-files-found: ignore
          retention-days: 1

  test:
    name: Tests
    runs-on: ubuntu-latest
    outputs:
      install_outcome: ${{ steps.install.outcome }}
      outcome: ${{ steps.tests.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: |
          set -o pipefail
          npm ci 2>&1 | tee /tmp/tests-install.log
      - name: Unit Tests
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/tests.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-tests
          path: /tmp/tests.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload test install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-log-tests-install
          path: /tmp/tests-install.log
          if-no-files-found: ignore
          retention-days: 1

  notify-discord:
    name: Discord notification
    needs:
      - prettier
      - lint
      - test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download CI logs
        uses: actions/download-artifact@v4
        with:
          pattern: ci-log-*
          path: /tmp/ci-logs
          merge-multiple: true
        continue-on-error: true
      - name: Notify Discord
        env:
          DISCORD_CICD_WEBHOOK: ${{ secrets.DISCORD_CICD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          PRETTIER_RESULT: ${{ needs.prettier.outputs.outcome || needs.prettier.result }}
          PRETTIER_INSTALL_RESULT: ${{ needs.prettier.outputs.install_outcome || needs.prettier.result }}
          LINT_RESULT: ${{ needs.lint.outputs.outcome || needs.lint.result }}
          LINT_INSTALL_RESULT: ${{ needs.lint.outputs.install_outcome || needs.lint.result }}
          TEST_RESULT: ${{ needs.test.outputs.outcome || needs.test.result }}
          TEST_INSTALL_RESULT: ${{ needs.test.outputs.install_outcome || needs.test.result }}
          PRETTIER_INSTALL_LOG: /tmp/ci-logs/prettier-install.log
          LINT_INSTALL_LOG: /tmp/ci-logs/lint-install.log
          TEST_INSTALL_LOG: /tmp/ci-logs/tests-install.log
          PRETTIER_LOG: /tmp/ci-logs/prettier.log
          LINT_LOG: /tmp/ci-logs/lint.log
          TEST_LOG: /tmp/ci-logs/tests.log
        run: node .github/scripts/notify-discord.mjs
        # Discord must never alter the CI result (missing secret, network, webhook error…).
        continue-on-error: true

  label-pr:
    name: PR labels
    needs:
      - prettier
      - lint
      - test
    if: >-
      ${{
        always() && github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PRETTIER_RESULT: ${{ needs.prettier.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        with:
          script: |
            const testPassed = process.env.TEST_RESULT === 'success';
            const qualityPassed =
              process.env.PRETTIER_RESULT === 'success' &&
              process.env.LINT_RESULT === 'success';

            async function applyOutcome(successLabel, failureLabel, passed) {
              for (const label of [successLabel, failureLabel]) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    name: label,
                  });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [passed ? successLabel : failureLabel],
              });
            }

            await applyOutcome('Tests réussis', 'Tests échoués', testPassed);
            await applyOutcome(
              'Code Quality réussie',
              'Code Quality échouée',
              qualityPassed,
            );
