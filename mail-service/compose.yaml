services:
  mail-service:
    build: { context: ., target: dev }
    environment:
      APP_URL: http://localhost:4200
      MAIL_FROM: LagonaDeck <no-reply@lagonadeck.local>
      RABBITMQ_URL: amqp://lagonadeck:lagonadeck@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
    ports: ['3007:3007']
    volumes: ['.:/app', '/app/.venv']
    depends_on:
      rabbitmq: { condition: service_healthy }

  # Serveur SMTP de dev : garde tous les e-mails, consultables sur le port 8025.
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ['1025:1025', '8025:8025']

  # Broker des messages envoyés à mail-service ; interface web sur le port 15672.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lagonadeck
      RABBITMQ_DEFAULT_PASS: lagonadeck
    ports: ['5672:5672', '15672:15672']
    volumes: ['rabbitmq:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      retries: 20

volumes:
  rabbitmq:
