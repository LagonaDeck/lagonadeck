[project]
name = "mail-service"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "aio-pika>=10.2",
  "fastapi>=0.140",
  "pydantic[email]>=2.12",
  "uvicorn>=0.50",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
