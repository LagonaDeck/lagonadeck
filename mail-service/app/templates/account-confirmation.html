<!doctype html>
<html lang="fr">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #f4f5f8;
      font-family: Arial, sans-serif;
      color: #1f2430;
    "
  >
    <div
      style="
        max-width: 520px;
        margin: 0 auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 12px;
      "
    >
      <h1 style="margin: 0 0 16px; font-size: 22px">
        Bienvenue sur LagonaDeck
      </h1>
      <p>Bonjour $username,</p>
      <p>Pour activer votre compte, confirmez votre adresse e-mail.</p>
      <p style="margin: 28px 0">
        <a
          href="$link"
          style="
            padding: 12px 20px;
            background: #2f6fed;
            color: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
          "
          >Confirmer mon adresse</a
        >
      </p>
      <p style="font-size: 13px; color: #5b6275">
        Le lien est valable 24 heures. Si vous n'avez pas créé de compte,
        ignorez cet e-mail.
      </p>
    </div>
  </body>
</html>
